<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faturas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="board">
<div class="top"><h1>Faturas</h1><button class="p" id="nova" type="button">+ Nova fatura</button><button id="prods" type="button">Produtos</button><span class="st" id="st">Modo local</span></div>
<input id="busca" placeholder="Pesquisar por nome..." style="max-width:260px">
<div class="cols" id="cols"></div>
</div>

<div id="prod">
<div class="bar"><button id="pfechar" type="button">← Voltar ao quadro</button></div>
<div class="form pform">
<h2>Produtos</h2>
<div class="row"><div><label>Nome</label><input id="pnome"></div><div><label>Preço (R$)</label><input id="ppreco" type="number" min="0" step="0.01"></div></div>
<button class="p" id="padd" type="button" style="margin-top:10px">Adicionar produto</button>
<label style="margin-top:16px">Pesquisar produto</label><input id="pbusca" placeholder="Buscar...">
<div id="plist"></div>
</div>
</div>

<div id="ed">
<div class="bar">
<button id="fechar" type="button">← Voltar ao quadro</button>
<button class="p" id="mover" type="button"></button>
<button id="print" type="button">Imprimir / PDF</button>
<button class="x" id="del" type="button">Excluir</button>
</div>
<div class="edgrid">
<div class="form">
<label>Cliente</label><input id="cli">
<label>CNPJ</label><input id="cnpj" placeholder="00.000.000/0000-00" inputmode="numeric">
<div class="row"><div><label>Data</label><input id="data" type="date"></div><div><label>Vencimento</label><input id="ven" type="date"></div></div>
<label>Itens (digite para buscar um produto)</label><div id="itens"></div>
<button class="p" id="add" type="button">+ Adicionar item</button>
<label style="margin-top:12px">Observações</label><textarea id="obs"></textarea>
</div>
<div><div class="sheet" id="sheet"></div></div>
</div>
</div>

<datalist id="dl-prod"></datalist>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
